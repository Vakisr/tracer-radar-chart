<!DOCTYPE html>
<html lang="en" style="background: #101010;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datadog vs Tracer Comparison</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'Britti Sans Trial';
            src: url('https://docs.tracer.cloud/fonts/BrittiSansTrial-Medium.woff2') format('woff2');
            font-weight: 500;
            font-style: normal;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Chakra Petch', sans-serif;
            background: #101010;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            color: #e5e7eb;
        }
        .container {
            width: 100%;
            max-width: 700px;
        }
        canvas {
            width: 100% !important;
            height: auto !important;
        }
        .legend {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 24px;
            font-size: 14px;
            font-weight: 500;
            color: #374151;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 16px;
            background: rgba(0, 0, 0, 0.02);
            border-radius: 6px;
            transition: all 0.2s ease;
        }
        .legend-item:hover {
            background: rgba(0, 0, 0, 0.04);
            transform: translateY(-1px);
        }
        @media (prefers-color-scheme: dark) {
            .legend {
                color: #ffffff;
            }
            .legend-item {
                background: rgba(255, 255, 255, 0.05);
            }
            .legend-item:hover {
                background: rgba(255, 255, 255, 0.1);
            }
        }
        .legend-color {
            width: 24px;
            height: 4px;
            border-radius: 2px;
        }
        .tooltip {
            position: absolute;
            background: rgba(17, 24, 39, 0.95);
            backdrop-filter: blur(8px);
            color: #f3f4f6;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13px;
            max-width: 280px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s ease;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .tooltip.visible {
            opacity: 1;
        }
        .hint {
            text-align: center;
            margin-top: 16px;
            font-size: 12px;
            color: #6b7280;
        }
    </style>
</head>
<body>
    <div class="container">
        <canvas id="radarChart"></canvas>
        <div class="legend">
            <div class="legend-item">
                <div class="legend-color" style="background: #3b82f6;"></div>
                <span>Datadog</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #27BF9F;"></div>
                <span>Datadog + Tracer</span>
            </div>
        </div>
        <div class="hint">Hover over the chart to see detailed descriptions</div>
    </div>
    <div id="tooltip" class="tooltip"></div>

    <script>
        const axisDescriptions = {
            'Execution Unit Awareness': 'Ability to organize telemetry around pipeline runs, tasks, and tools rather than services or hosts.',
            'Short-lived Process Visibility': 'Capturing behavior of processes and containers that run for seconds or minutes.',
            'Pipeline/Run Attribution': 'Associating resource usage and behavior with specific pipeline runs and execution steps.',
            'Cost Attribution Granularity': 'Breaking down compute costs by pipeline, run, task, or tool.',
            'Host-observed Behavior': 'Observing actual runtime behavior from the host and container runtime.',
            'Org-wide Telemetry Coverage': 'Collecting and correlating telemetry across many systems, services, and applications.'
        };

        const ctx = document.getElementById('radarChart').getContext('2d');
        const chart = new Chart(ctx, {
            type: 'radar',
            data: {
                labels: [
                    'Execution Unit Awareness',
                    'Short-lived Process Visibility',
                    'Pipeline/Run Attribution',
                    'Cost Attribution Granularity',
                    'Host-observed Behavior',
                    'Org-wide Telemetry Coverage'
                ],
                datasets: [
                    {
                        label: 'Datadog',
                        data: [1, 2, 1, 1, 2, 5],
                        backgroundColor: 'rgba(59, 130, 246, 0.15)',
                        borderColor: '#3b82f6',
                        borderWidth: 2,
                        pointBackgroundColor: '#3b82f6',
                        pointBorderColor: '#fff',
                        pointBorderWidth: 1,
                        pointRadius: 4,
                        pointHoverRadius: 6
                    },
                    {
                        label: 'Datadog + Tracer',
                        data: [5, 5, 5, 5, 5, 5],
                        backgroundColor: 'rgba(39, 191, 159, 0.15)',
                        borderColor: '#27BF9F',
                        borderWidth: 2,
                        pointBackgroundColor: '#27BF9F',
                        pointBorderColor: '#fff',
                        pointBorderWidth: 1,
                        pointRadius: 4,
                        pointHoverRadius: 6
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: true,
                plugins: {
                    legend: {
                        display: false
                    },
                    tooltip: {
                        enabled: false
                    }
                },
                scales: {
                    r: {
                        beginAtZero: true,
                        max: 5,
                        min: 0,
                        ticks: {
                            stepSize: 1,
                            display: false
                        },
                        grid: {
                            color: 'rgba(156, 163, 175, 0.2)',
                            circular: true
                        },
                        angleLines: {
                            color: 'rgba(156, 163, 175, 0.2)'
                        },
                        pointLabels: {
                            font: {
                                family: "'Chakra Petch', sans-serif",
                                size: 12,
                                weight: '500'
                            },
                            color: '#9ca3af',
                            padding: 16
                        }
                    }
                },
                interaction: {
                    intersect: false,
                    mode: 'nearest'
                }
            }
        });

        const tooltip = document.getElementById('tooltip');
        const canvas = document.getElementById('radarChart');

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            
            const angle = Math.atan2(y - centerY, x - centerX);
            const normalizedAngle = (angle + Math.PI / 2 + 2 * Math.PI) % (2 * Math.PI);
            
            const labels = chart.data.labels;
            const segmentAngle = (2 * Math.PI) / labels.length;
            const labelIndex = Math.floor((normalizedAngle + segmentAngle / 2) % (2 * Math.PI) / segmentAngle);
            
            const distance = Math.sqrt(Math.pow(x - centerX, 2) + Math.pow(y - centerY, 2));
            const maxRadius = Math.min(centerX, centerY) * 0.75;
            
            if (distance < maxRadius * 1.4 && distance > 20) {
                const label = labels[labelIndex];
                const description = axisDescriptions[label];
                
                tooltip.innerHTML = `<strong>${label}</strong><br><br>${description}`;
                tooltip.classList.add('visible');
                
                let tooltipX = e.clientX + 15;
                let tooltipY = e.clientY + 15;
                
                if (tooltipX + 280 > window.innerWidth) {
                    tooltipX = e.clientX - 295;
                }
                if (tooltipY + 100 > window.innerHeight) {
                    tooltipY = e.clientY - 100;
                }
                
                tooltip.style.left = tooltipX + 'px';
                tooltip.style.top = tooltipY + 'px';
            } else {
                tooltip.classList.remove('visible');
            }
        });

        canvas.addEventListener('mouseleave', () => {
            tooltip.classList.remove('visible');
        });
    </script>
</body>
</html>
