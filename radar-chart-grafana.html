<!DOCTYPE html>
<html lang="en" style="background: transparent;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>Grafana vs Tracer+Grafana Radar Chart</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            background: #FBFBFB;
        }
        body {
            font-family: "Britti Sans Trial", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
            background: #FBFBFB;
            padding: 10px;
            margin: 0;
            overflow: hidden;
        }
        @media (prefers-color-scheme: dark) {
            html {
                background: #101010;
            }
            body {
                background: #101010;
            }
        }
        .container {
            max-width: 100%;
            margin: 0 auto;
            padding: 20px 30px;
        }
        canvas {
            max-width: 100%;
            height: auto !important;
            filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.05));
            background: transparent !important;
        }
        .legend {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 24px;
            font-size: 14px;
            font-weight: 500;
            color: #374151;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 16px;
            background: rgba(0, 0, 0, 0.02);
            border-radius: 6px;
            transition: all 0.2s ease;
        }
        .legend-item:hover {
            background: rgba(0, 0, 0, 0.04);
            transform: translateY(-1px);
        }
        @media (prefers-color-scheme: dark) {
            .legend {
                color: #ffffff;
            }
            .legend-item {
                background: rgba(255, 255, 255, 0.05);
            }
            .legend-item:hover {
                background: rgba(255, 255, 255, 0.1);
            }
        }
        .legend-color {
            width: 24px;
            height: 4px;
            border-radius: 2px;
        }
        .tooltip {
            position: absolute;
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 0.125rem;
            padding: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            max-width: 300px;
            z-index: 1000;
            color: #374151;
        }
        .tooltip.show {
            opacity: 1;
        }
        @media (prefers-color-scheme: dark) {
            .tooltip {
                background: #0a0a0a;
                border-color: #262626;
                color: #ffffff;
                box-shadow: 0 4px 6px rgba(0, 0, 0, 0.5);
            }
        }
        .tooltip-title {
            font-weight: 600;
            margin-bottom: 8px;
            color: #111827;
        }
        .tooltip-content {
            font-size: 13px;
            color: #6b7280;
            line-height: 1.5;
        }
        @media (prefers-color-scheme: dark) {
            .tooltip-title {
                color: #ffffff;
            }
            .tooltip-content {
                color: #d1d5db;
            }
        }
        .hint {
            text-align: center;
            margin-top: 16px;
            color: #6b7280;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="container">
        <canvas id="radarChart"></canvas>
        <div class="legend">
            <div class="legend-item">
                <div class="legend-color" style="background: #3b82f6;"></div>
                <span>Grafana</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #27BF9F;"></div>
                <span>Grafana + Tracer</span>
            </div>
        </div>
        <div class="hint">Hover over the chart to see detailed descriptions</div>
    </div>
    <div id="tooltip" class="tooltip">
        <div class="tooltip-title"></div>
        <div class="tooltip-content"></div>
    </div>

    <script>
        const axisDescriptions = {
            'Execution Unit Awareness': 'Ability to organize telemetry around pipeline runs, tasks, and tools rather than services or hosts.',
            'Short-lived Process Visibility': 'Capturing behavior of processes and containers that run for seconds or minutes.',
            'Pipeline/Run Attribution': 'Associating resource usage and behavior with specific pipeline runs and execution steps.',
            'Cost Attribution Granularity': 'Breaking down compute costs by pipeline, run, task, or tool.',
            'Host-observed Behavior': 'Observing actual runtime behavior from the host and container runtime.',
            'Dashboard Flexibility': 'Ability to build custom visualizations from arbitrary data sources and queries.'
        };

        const ctx = document.getElementById('radarChart').getContext('2d');
        const chart = new Chart(ctx, {
            type: 'radar',
            data: {
                labels: [
                    'Execution Unit Awareness',
                    'Short-lived Process Visibility',
                    'Pipeline/Run Attribution',
                    'Cost Attribution Granularity',
                    'Host-observed Behavior',
                    'Dashboard Flexibility'
                ],
                datasets: [
                    {
                        label: 'Grafana',
                        data: [1, 1, 1, 1, 1, 5],
                        backgroundColor: 'rgba(59, 130, 246, 0.15)',
                        borderColor: '#3b82f6',
                        borderWidth: 2,
                        pointBackgroundColor: '#3b82f6',
                        pointBorderColor: '#fff',
                        pointBorderWidth: 1,
                        pointRadius: 4,
                        pointHoverRadius: 6
                    },
                    {
                        label: 'Grafana + Tracer',
                        data: [5, 5, 5, 5, 5, 5],
                        backgroundColor: 'rgba(39, 191, 159, 0.15)',
                        borderColor: '#27BF9F',
                        borderWidth: 2,
                        pointBackgroundColor: '#27BF9F',
                        pointBorderColor: '#fff',
                        pointBorderWidth: 1,
                        pointRadius: 4,
                        pointHoverRadius: 6
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: true,
                plugins: {
                    legend: {
                        display: false
                    },
                    tooltip: {
                        enabled: false
                    }
                },
                scales: {
                    r: {
                        beginAtZero: true,
                        max: 5,
                        min: 0,
                        ticks: {
                            stepSize: 1,
                            display: false
                        },
                        grid: {
                            color: window.matchMedia('(prefers-color-scheme: dark)').matches ? '#374151' : '#e5e7eb',
                            circular: true
                        },
                        angleLines: {
                            color: window.matchMedia('(prefers-color-scheme: dark)').matches ? '#374151' : '#e5e7eb',
                        },
                        pointLabels: {
                            font: {
                                family: '"Britti Sans Trial", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif',
                                size: 12,
                                weight: '500'
                            },
                            color: window.matchMedia('(prefers-color-scheme: dark)').matches ? '#ffffff' : '#374151',
                            padding: 16
                        }
                    }
                },
                interaction: {
                    intersect: false,
                    mode: 'nearest'
                }
            }
        });

        const tooltip = document.getElementById('tooltip');
        const tooltipTitle = tooltip.querySelector('.tooltip-title');
        const tooltipContent = tooltip.querySelector('.tooltip-content');
        const canvas = document.getElementById('radarChart');

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            
            const angle = Math.atan2(y - centerY, x - centerX);
            const normalizedAngle = (angle + Math.PI / 2 + 2 * Math.PI) % (2 * Math.PI);
            
            const labels = chart.data.labels;
            const segmentAngle = (2 * Math.PI) / labels.length;
            const labelIndex = Math.floor((normalizedAngle + segmentAngle / 2) % (2 * Math.PI) / segmentAngle);
            
            const distance = Math.sqrt(Math.pow(x - centerX, 2) + Math.pow(y - centerY, 2));
            const maxRadius = Math.min(centerX, centerY) * 0.75;
            
            if (distance < maxRadius * 1.4 && distance > 20) {
                const label = labels[labelIndex];
                const description = axisDescriptions[label];
                
                tooltipTitle.textContent = label;
                tooltipContent.textContent = description;
                tooltip.classList.add('show');
                
                let tooltipX = e.clientX + 15;
                let tooltipY = e.clientY + 15;
                
                if (tooltipX + 300 > window.innerWidth) {
                    tooltipX = e.clientX - 315;
                }
                if (tooltipY + 100 > window.innerHeight) {
                    tooltipY = e.clientY - 100;
                }
                
                tooltip.style.left = tooltipX + 'px';
                tooltip.style.top = tooltipY + 'px';
            } else {
                tooltip.classList.remove('show');
            }
        });

        canvas.addEventListener('mouseleave', () => {
            tooltip.classList.remove('show');
        });
    </script>
</body>
</html>
